---
job: extension
config:
  name: "wakinglife_flux2_klein4b_paired_mps_pilot_bf16_nosample"
  process:
    - type: "sd_trainer"
      training_folder: "/Users/leona/Documents/Playground/painterly-rotoscope-animation/runs/flux2_klein4b_paired_mps_pilot_bf16_nosample"
