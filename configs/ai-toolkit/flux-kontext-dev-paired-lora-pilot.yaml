---
job: extension
config:
  name: "wakinglife_flux_kontext_paired_pilot"
  process:
    - type: "sd_trainer"
      training_folder: "/Users/leona/Documents/Playground/painterly-rotoscope-animation/runs/flux_kontext_paired_pilot"
      device: cuda:0
      network:
        type: "lora"
        linear: 16
        linear_alpha: 16
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 6
        push_to_hub: false
      datasets:
        - folder_path: "/Users/leona/Documents/Playground/painterly-rotoscope-animation/runs/datasets/flux2_klein_v0_plus_dense_three/train/styled"
          control_path: "/Users/leona/Documents/Playground/painterly-rotoscope-animation/runs/datasets/flux2_klein_v0_plus_dense_three/train/control"
          caption_ext: "txt"
          caption_dropout_rate: 0.03
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [512, 768]
      train:
        batch_size: 1
        steps: 1250
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        timestep_type: "weighted"
        dtype: bf16
      model:
        name_or_path: "black-forest-labs/FLUX.1-Kontext-dev"
        arch: "flux_kontext"
        quantize: true
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1280
        height: 800
        prompts:
          - "Repaint this interview frame as a cinematic painted rotoscope image with bold dark contour lines, visible brushstrokes, soft color blocking, preserved lip fullness, preserved facial structure, and the same outdoor pool setting. --ctrl_img /Users/leona/Downloads/waking life interview/nano_keyframes/frame_0170.png"
          - "Repaint this interview frame as a cinematic painted rotoscope image with bold dark contour lines, visible brushstrokes, soft color blocking, preserved lip fullness, preserved facial structure, and the same outdoor pool setting. --ctrl_img /Users/leona/Downloads/waking life interview/nano_keyframes/frame_0605.png"
          - "Repaint this interview frame as a cinematic painted rotoscope image with bold dark contour lines, visible brushstrokes, soft color blocking, preserved lip fullness, preserved facial structure, and the same outdoor pool setting. --ctrl_img /Users/leona/Downloads/waking life interview/nano_keyframes/frame_0786.png"
        neg: ""
        seed: 42
        walk_seed: false
        guidance_scale: 4
        sample_steps: 20
meta:
  name: "[name]"
  version: "1.0"
